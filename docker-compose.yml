services:
  app:
    build:
      context: ./app
      args:
        VITE_API_URL: ${BACKEND_URL}
    environment:
      VITE_API_URL: ${BACKEND_URL}
      BACKEND_URL: ${BACKEND_URL}
    restart: unless-stopped

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_LOCATION: ${GCP_LOCATION:-us-east4}
      VERTEX_RAG_EMBEDDING_MODEL: ${VERTEX_RAG_EMBEDDING_MODEL:-publishers/google/models/text-embedding-005}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started

  api-worker:
    build:
      context: ./api
    restart: unless-stopped
    command: ["/api/start-worker.sh"]
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_LOCATION: ${GCP_LOCATION:-us-east4}
      VERTEX_RAG_EMBEDDING_MODEL: ${VERTEX_RAG_EMBEDDING_MODEL:-publishers/google/models/text-embedding-005}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
