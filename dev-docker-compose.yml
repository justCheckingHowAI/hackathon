services:
  app:
    build:
      context: ./app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:80"

  api:
    build:
      context: ./api
    env_file:
      - .env
    ports:
      - "8001:80"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gemellus}:${POSTGRES_PASSWORD:-gemellus}@postgres:5432/${POSTGRES_DB:-gemellus}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_LOCATION: ${GCP_LOCATION:-us-east4}
      VERTEX_RAG_EMBEDDING_MODEL: ${VERTEX_RAG_EMBEDDING_MODEL:-publishers/google/models/text-embedding-005}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  api-worker:
    build:
      context: ./api
    restart: unless-stopped
    command: ["/api/start-worker.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gemellus}:${POSTGRES_PASSWORD:-gemellus}@postgres:5432/${POSTGRES_DB:-gemellus}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_LOCATION: ${GCP_LOCATION:-us-east4}
      VERTEX_RAG_EMBEDDING_MODEL: ${VERTEX_RAG_EMBEDDING_MODEL:-publishers/google/models/text-embedding-005}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gemellus}
      POSTGRES_USER: ${POSTGRES_USER:-gemellus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gemellus}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemellus} -d ${POSTGRES_DB:-gemellus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  dev_postgres_data:
